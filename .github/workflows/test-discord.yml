name: Test Discord Notification

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Choose which notification to preview.'
        type: choice
        options:
          - success
          - failure
          - downstream_failure
          - metadata_only
        default: success

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - name: Generate an oversized fake GPUI diff
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          output = Path('preview')
          output.mkdir(exist_ok=True)
          current = Path('UPSTREAM').read_text().strip() if Path('UPSTREAM').exists() else ''
          previous = subprocess.run(
              ['git', 'show', 'HEAD~8:UPSTREAM'],
              capture_output=True, text=True, check=False,
          ).stdout.strip()

          files = []
          chunks = []
          for index in range(100):
              name = f'crates/gpui/src/synthetic_{index:03d}.rs'
              files.append({'path': name, 'added': 30, 'removed': 10})
              chunks.append(
                  f'diff --git a/{name} b/{name}\n'
                  f'--- a/{name}\n'
                  f'+++ b/{name}\n'
                  '@@ -10,2 +10,3 @@\n'
              )
              for line in range(30):
                  chunks.append(f'-    let old_{line} = render_before({index}, {line});\n')
                  chunks.append(f'+    let new_{line} = render_after({index}, {line});\n')
          patch = ''.join(chunks)
          (output / 'gpui.patch').write_text(patch, encoding='utf-8')
          report = {
              'previous': previous,
              'current': current,
              'crate_count': 85,
              'file_count': 100,
              'added': 3000,
              'removed': 1000,
              'new_crates': ['gpui_example_new', 'render_utils', 'display_bridge'],
              'removed_crates': ['legacy_window_backend'],
              'largest_files': files[:5],
              'has_relevant_changes': True,
          }
          (output / 'report.json').write_text(json.dumps(report), encoding='utf-8')
          assert len(patch) > 4096, 'Fake patch must exceed Discord description limit'
          print(f'Generated fake patch: {len(patch):,} characters (Discord description max: 4,096)')
          PY
      - name: Validate truncation and send real Discord embed
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_THREAD_ID: ${{ vars.DISCORD_THREAD_ID }}
          DISCORD_CREATE_THREAD: ${{ vars.DISCORD_CREATE_THREAD }}
          TEST_SCENARIO: ${{ inputs.scenario }}
          EXAMPLE_PR_URL: ${{ vars.DISCORD_TEST_PR_URL || 'https://github.com/duif-mail/duif/pull/28' }}
        shell: bash
        run: |
          status=success
          if [ "$TEST_SCENARIO" = 'failure' ]; then status=failed; fi
          args=(--report preview/report.json --patch preview/gpui.patch --status "$status" --commit "$GITHUB_SHA" --test)
          if [ "$TEST_SCENARIO" = 'downstream_failure' ]; then
            args+=(--pr-failed)
          else
            args+=(--pr-url "$EXAMPLE_PR_URL")
          fi

          if [ "$TEST_SCENARIO" = 'metadata_only' ]; then
            python3 - <<'PY'
          import json
          from pathlib import Path
          report_file = Path('preview/report.json')
          report = json.loads(report_file.read_text())
          report.update(has_relevant_changes=False, file_count=0, added=0, removed=0, largest_files=[])
          report_file.write_text(json.dumps(report))
          PY
          fi

          python3 scripts/notify_discord.py "${args[@]}" --dry-run > preview/payload.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('preview/payload.json').read_text())
          if payload.get('skipped'):
              assert payload['reason'] == 'No relevant GPUI changes'
              print('Metadata-only notification suppressed')
          elif 'embeds' in payload:
              assert len(payload['embeds']) == 1
              embed = payload['embeds'][0]
              assert len(embed['description']) <= 4096
              assert 'preview truncated' in embed['description']
              assert any(field['name'] == 'Links' for field in embed['fields'])
              print(f"Payload validated: {len(embed['description'])} description characters, "
                    f"{len(embed['fields'])} fields, 1 embed, truncation visible")
          else:
              assert 'sync failed' in payload['content']
              print('Failure notification validated (no embed)')
          PY
          python3 scripts/notify_discord.py "${args[@]}"
