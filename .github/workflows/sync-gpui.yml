name: Auto-sync GPUI from Zed

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      force_downstream:
        description: 'Reopen or refresh the downstream PR even when there are no new mirror changes.'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: gpui-mirror-sync
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install manifest tooling
        run: python -m pip install 'tomlkit==0.13.3'
      - name: Save current upstream revision
        run: |
          if [ -f UPSTREAM ]; then
            cp UPSTREAM "$RUNNER_TEMP/previous-upstream"
          fi
      - name: Download upstream Zed temporarily
        run: git clone --depth 1 --filter=blob:none https://github.com/zed-industries/zed.git "$RUNNER_TEMP/zed"
      - name: Extract GPUI and its in-tree dependency closure
        run: python scripts/extract_gpui.py --upstream "$RUNNER_TEMP/zed" --output .
      - name: Apply optional patches
        shell: bash
        run: |
          shopt -s nullglob
          for patch in patches/*.patch; do
            git apply --check "$patch"
            git apply "$patch"
          done
      - name: Compute mirror diff and changelog
        id: detect
        shell: bash
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'Mirror already up to date.'
            exit 0
          fi
          echo 'changed=true' >> "$GITHUB_OUTPUT"
          mkdir -p .sync-artifacts
          python scripts/report_sync.py \
            --mirror . \
            --upstream "$RUNNER_TEMP/zed" \
            --previous "$RUNNER_TEMP/previous-upstream" \
            --output .sync-artifacts/report.json
          git diff --cached --binary > .sync-artifacts/gpui.patch
          tar -czf .sync-artifacts/mirror.tar.gz --exclude=.git --exclude=.sync-artifacts --exclude=target -C "$GITHUB_WORKSPACE" .
          git diff --cached --stat | tail -30
      - name: Upload changes for publishing and multi-platform checks
        if: steps.detect.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: gpui-sync-preview
          path: .sync-artifacts/
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: error

  validate:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gpui-sync-preview
          path: preview
      - name: Unpack proposed mirror
        shell: bash
        run: |
          mkdir -p mirror
          tar -xzf preview/mirror.tar.gz -C mirror
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libfontconfig1-dev \
            libwayland-dev libxkbcommon-dev libx11-dev libxcursor-dev \
            libxi-dev libxrandr-dev libxinerama-dev libgl1-mesa-dev libegl1-mesa-dev
      - name: Set Rust toolchain from upstream rust-toolchain.toml
        working-directory: mirror
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mirror
      - name: Validate workspace metadata
        working-directory: mirror
        run: cargo metadata --format-version 1 --no-deps
      - name: Compile GPUI and platform backends
        working-directory: mirror
        run: cargo check -p gpui -p gpui_platform

  publish:
    needs: [prepare, validate]
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.push.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: gpui-sync-preview
          path: preview
      - name: Commit extracted GPUI directly to main
        id: push
        shell: bash
        run: |
          git apply --index --binary preview/gpui.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Sync GPUI to Zed $(git show :UPSTREAM | cut -c1-12)"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  downstream:
    needs: [prepare, validate, publish]
    if: >-
      always() && vars.DOWNSTREAM_REPO != '' && needs.prepare.result == 'success' && (
        (needs.publish.result == 'success' && needs.validate.result == 'success') ||
        (inputs.force_downstream && needs.prepare.outputs.changed != 'true')
      )
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      pr_url: ${{ steps.pr.outputs.url }}
    env:
      DOWNSTREAM_REPO: ${{ vars.DOWNSTREAM_REPO }}
      PIN_PATH: ${{ vars.DOWNSTREAM_SUBMODULE_PATH || 'third_party/gpui' }}
      NEW: ${{ needs.publish.outputs.sha }}
      UNVALIDATED: ${{ needs.publish.result == 'success' && 'false' || 'true' }}
      BRANCH: automation/gpui-sync
    steps:
      - name: Require the downstream token
        env:
          TOKEN: ${{ secrets.DOWNSTREAM_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo '::error::Set the DOWNSTREAM_TOKEN Actions secret: a token with contents and pull-requests write access to the downstream repository.'
            exit 1
          fi
      - name: Check out this mirror with full history
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.publish.outputs.sha || github.sha }}
          fetch-depth: 0
          path: mirror
      - name: Check out the downstream repository
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.DOWNSTREAM_REPO }}
          ref: ${{ vars.DOWNSTREAM_BASE_BRANCH }}
          token: ${{ secrets.DOWNSTREAM_TOKEN }}
          path: downstream
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Open or update the downstream pull request
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DOWNSTREAM_TOKEN }}
        run: |
          set -euo pipefail
          base="$(git -C downstream branch --show-current)"

          if [ -z "$NEW" ]; then
            NEW="$(git -C mirror log -1 --format=%H --grep='^Sync GPUI to Zed')"
            if [ -z "$NEW" ]; then
              echo '::error::This mirror has no sync commit to pin yet'
              exit 1
            fi
          fi

          entry="$(git -C downstream ls-tree HEAD -- "$PIN_PATH")"
          case "$entry" in
            '160000 commit '*) ;;
            *) echo "::error::$PIN_PATH is not a submodule in $DOWNSTREAM_REPO@$base"; exit 1 ;;
          esac
          old="$(printf '%s' "$entry" | awk '{print $3}')"
          name="$( (git -C downstream config -f .gitmodules --get-regexp '^submodule\..*\.path$' || true) \
            | awk -v p="$PIN_PATH" '$2 == p { sub(/^submodule\./, "", $1); sub(/\.path$/, "", $1); print $1 }')"
          url="$(git -C downstream config -f .gitmodules --get "submodule.${name}.url" || true)"
          normalized="${url,,}"; normalized="${normalized%.git}"
          case "$normalized" in
            *[/:]"${GITHUB_REPOSITORY,,}") ;;
            *) echo "::error::Submodule $PIN_PATH points at '$url', not at $GITHUB_REPOSITORY"; exit 1 ;;
          esac
          if [ "$old" = "$NEW" ]; then
            echo "$PIN_PATH already points at $NEW."
            echo "$DOWNSTREAM_REPO already pins $NEW (the latest sync); no pull request needed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          new_up="$(git -C mirror show "$NEW:UPSTREAM")"
          old_up=''
          if git -C mirror cat-file -e "$old^{commit}" 2>/dev/null; then
            old_up="$(git -C mirror show "$old:UPSTREAM")"
          fi
          zed="$RUNNER_TEMP/zed"
          if [[ "$new_up" =~ ^[[:xdigit:]]{40}$ ]]; then
            git init -q "$zed"
            git -C "$zed" remote add origin https://github.com/zed-industries/zed.git
            git -C "$zed" fetch -q --depth 1 --filter=blob:none origin "$new_up" || true
            if [[ "$old_up" =~ ^[[:xdigit:]]{40}$ ]]; then
              for n in 1 2 3 4 5; do
                if git -C "$zed" cat-file -e "$old_up^{commit}" 2>/dev/null; then break; fi
                git -C "$zed" fetch -q --filter=blob:none --deepen=200 origin "$new_up" || break
              done
            fi
          fi

          title_file="$RUNNER_TEMP/pr-title.txt"
          body_file="$RUNNER_TEMP/pr-body.md"
          render_args=()
          if [ "$UNVALIDATED" = 'true' ]; then render_args+=(--unvalidated); fi
          python mirror/scripts/downstream_pr.py \
            --mirror mirror --upstream "$zed" --old "$old" --new "$NEW" \
            --repository "$GITHUB_REPOSITORY" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --body-out "$body_file" --title-out "$title_file" "${render_args[@]}"
          title="$(cat "$title_file")"

          git -C downstream checkout -q -B "$BRANCH"
          git -C downstream update-index --cacheinfo "160000,$NEW,$PIN_PATH"
          git -C downstream \
            -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "$title" -m "Mirror commit: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$NEW"
          git -C downstream push -q --force origin "$BRANCH"

          number="$(gh pr list --repo "$DOWNSTREAM_REPO" --head "$BRANCH" --base "$base" --state open \
            --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh pr edit "$number" --repo "$DOWNSTREAM_REPO" --title "$title" --body-file "$body_file"
            pr_url="$(gh pr view "$number" --repo "$DOWNSTREAM_REPO" --json url --jq .url)"
          else
            pr_url="$(gh pr create --repo "$DOWNSTREAM_REPO" --base "$base" --head "$BRANCH" \
              --title "$title" --body-file "$body_file")"
          fi
          echo "Pull request: $pr_url"
          echo "Pull request: $pr_url" >> "$GITHUB_STEP_SUMMARY"
          echo "url=$pr_url" >> "$GITHUB_OUTPUT"

  notify:
    needs: [prepare, validate, publish, downstream]
    if: always() && (needs.prepare.outputs.changed == 'true' || needs.prepare.result == 'failure')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Download changelog if one was generated
        if: needs.prepare.outputs.changed == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: gpui-sync-preview
          path: preview
      - name: Post Discord notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_THREAD_ID: ${{ vars.DISCORD_THREAD_ID }}
          DISCORD_CREATE_THREAD: ${{ vars.DISCORD_CREATE_THREAD }}
          PUSHED_SHA: ${{ needs.publish.outputs.sha }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          DOWNSTREAM_RESULT: ${{ needs.downstream.result }}
          DOWNSTREAM_PR_URL: ${{ needs.downstream.outputs.pr_url }}
        shell: bash
        run: |
          status=failed
          if [ "$PUBLISH_RESULT" = 'success' ]; then
            status=success
          fi
          args=(--report preview/report.json --patch preview/gpui.patch --status "$status" --commit "$PUSHED_SHA")
          if [ -n "$DOWNSTREAM_PR_URL" ]; then args+=(--pr-url "$DOWNSTREAM_PR_URL"); fi
          if [ "$DOWNSTREAM_RESULT" = 'failure' ]; then args+=(--pr-failed); fi
          python scripts/notify_discord.py "${args[@]}"
